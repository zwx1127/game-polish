[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-polish"
version = "0.1.1"
description = "Evidence-first game polishing workflow for an existing assistant and computer"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
game-polish = "game_polish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
